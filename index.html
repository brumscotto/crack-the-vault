<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crack the Vault</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,500;0,600;1,500;1,600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="defs"></div>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <button class="exitbtn" id="exitBtn" hidden></button>
    <button class="brand" id="brand" aria-label="Crack the Vault: back to the floors"></button>
    <div class="crumb" id="crumb" hidden></div>
    <div class="meters" id="meters" hidden>
      <div class="meter" id="moveMeter" aria-live="polite"></div>
      <div class="meter alarms" id="alarmMeter" title="Alarm: three wrong calls and you're busted"></div>
      <div class="meter timer" id="timer" hidden></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tools" id="tools">
      <button class="tool" id="tipBtn" hidden></button>
      <button class="tool" id="undoBtn" hidden></button>
      <button class="tool" id="workBtn" hidden></button>
      <button class="tool icon-only" id="soundBtn" aria-label="Sound"></button>
      <button class="tool icon-only" id="settingsBtn" aria-label="Settings"></button>
    </div>
  </header>

  <main class="screen map-screen" id="mapScreen"></main>

  <main class="screen game-screen" id="gameScreen" hidden>
    <section class="bench" id="bench" aria-label="Workbench">
      <div class="sheet-head" id="sheetHead"></div>
      <div class="rows-wrap"><div class="rows" id="rows"></div></div>
      <div class="legend" id="legend"></div>
      <div class="titleblock" id="titleblock" aria-hidden="true"></div>
    </section>
    <aside class="vaultside" aria-label="Vault">
      <div class="door-wrap" id="door"></div>
      <div class="combo" id="combo"></div>
      <div class="declare" id="declare" hidden></div>
      <div class="feed" id="feed" role="log" aria-live="polite"></div>
    </aside>
  </main>

  <div class="popover" id="popover" hidden>
    <label class="pop-label" for="mulIn" id="mulLabel">Multiply every term in row A by</label>
    <div class="pop-row"><input id="mulIn" autocomplete="off" inputmode="text" placeholder="3, &minus;2, 1/2"><button class="btn brass" id="mulGo">Multiply</button></div>
    <div class="pop-err" id="mulErr"></div>
  </div>
  <div id="introRoot" class="intro-root" hidden></div>
  <div class="scrim file-scrim" id="filePanel" hidden><div class="modal casefile" id="fileBody" role="dialog" aria-modal="true" aria-label="Case file"></div></div>
  <div class="scrim" id="modal" hidden><div class="modal" id="modalBody" role="dialog" aria-modal="true"></div></div>
</div>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/intro.js"></script>
<script src="js/game.js"></script>
</body>
</html>
